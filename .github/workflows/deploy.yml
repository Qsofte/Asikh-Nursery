name: Deploy to Server

on:
  push:
    branches:
      - QPW-1  # Jab bhi main branch pe push hoga, deploy hoga

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t amanqsofte/asikh:latest .

      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Image to DockerHub
        run: docker push amanqsofte/asikh:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker stop asikh-container || true
            docker rm asikh-container || true
            docker pull amanqsofte/asikh:latest
            docker run -d -p 80:5000 amanqsofte/asikh:latest
