name: CI/CD Deployment

on:
  push:
    branches:
      - QPW-1  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Build Docker Image
        run: docker build -t amanqsofte/asikh:latest .

      - name: Push Docker Image
        run: docker push amanqsofte/asikh:latest

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy to Server
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} <<EOF
          
          echo "✅ Checking running Docker containers..."
          
          # Stop & remove old container if it exists
          if docker ps -a --format '{{.Names}}' | grep -q "modest_lalande"; then
            echo "⚠️ Removing existing container..."
            docker stop modest_lalande
            docker rm modest_lalande
          fi

          echo "✅ Pulling latest Docker image..."
          docker pull amanqsofte/asikh:latest

          echo "✅ Freeing up port 80 if occupied..."
          sudo -S fuser -k 80/tcp <<< "${{ secrets.SERVER_PASSWORD }}"

          echo "✅ Running new container..."
          docker run -d --name modest_lalande -p 80:5000 amanqsofte/asikh:latest
          
          EOF
