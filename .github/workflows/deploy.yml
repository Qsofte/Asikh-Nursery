name: CI/CD Deployment

on:
  push:
    branches:
      - QPW-1  

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      # Step 3: Build Docker Image
      - name: Build Docker Image
        run: docker build -t amanqsofte/asikh:latest .

      # Step 4: Push Docker Image to Docker Hub
      - name: Push Docker Image
        run: docker push amanqsofte/asikh:latest

      # Step 5: Install sshpass
      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      # Step 6: Deploy to Remote Server with Cleanup on Space Error
      - name: Deploy to Server
        run: |
          sshpass -p "${{ secrets.SERVER_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} <<EOF
          
          # Try pulling the latest image
          if ! docker pull amanqsofte/asikh:latest; then
            echo "⚠️ Docker pull failed. Cleaning up space..."
            docker system prune -a -f
            docker volume prune -f
            docker pull amanqsofte/asikh:latest
          fi
          
          # Stop and remove old container if running
          if [ "$(docker ps -q -f name=modest_lalande)" ]; then
            docker stop modest_lalande
            docker rm modest_lalande
          fi

          # Run new container
          docker run -d --name modest_lalande -p 80:5000 amanqsofte/asikh:latest
          EOF
